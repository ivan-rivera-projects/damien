[project]
name = "damien"
version = "0.2.0"
description = "A Gmail triage CLI that asks before it acts: rules first, a model for the residue, and journalled, reversible writes."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ivan Rivera" }]
keywords = ["gmail", "email", "triage", "inbox", "cli", "automation", "rules", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Email",
  "Topic :: Office/Business",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "typer>=0.12",
  "google-auth>=2.30",
  "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
pg = ["psycopg[binary]>=3.1"]
vectors = ["fastembed>=0.4"]
dev = ["pytest>=8", "psycopg[binary]>=3.1"]

[project.urls]
Homepage = "https://github.com/ivan-rivera-projects/damien"
Repository = "https://github.com/ivan-rivera-projects/damien"
Issues = "https://github.com/ivan-rivera-projects/damien/issues"

[project.scripts]
damien = "damien.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/damien"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 140
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
# E501: the CLI's help text and the docs read as prose, and wrapping them hurts more than it
# helps. UP042: `str, Enum` is deliberate — it serialises predictably to the JSON that ends up
# in the store. RUF002: em-dashes and × are intentional in prose.
ignore = ["E501", "UP042", "RUF002"]

[tool.ruff.lint.per-file-ignores]
# typer's API is Option()/Argument() in defaults; B008 is wrong for it.
"src/damien/cli.py" = ["B008"]
