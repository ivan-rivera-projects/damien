<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" font-family="Impact, 'Arial Black', Helvetica, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b4fd8"/>
      <stop offset="1" stop-color="#5aa0ff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff5a0"/>
      <stop offset="0.5" stop-color="#ffd000"/>
      <stop offset="1" stop-color="#e08a00"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.12"/>
    </pattern>
    <filter id="shadow"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000"/></filter>
  </defs>

  <!-- sky, sunburst, floor -->
  <rect width="1280" height="400" fill="url(#sky)"/>
  <g transform="translate(640 420)" opacity="0.35">
    <g fill="#fff">
      <polygon points="0,0 -900,-80 -900,80"/><polygon points="0,0 -700,-400 -520,-400"/>
      <polygon points="0,0 -260,-500 -60,-500"/><polygon points="0,0 60,-500 260,-500"/>
      <polygon points="0,0 520,-400 700,-400"/><polygon points="0,0 900,-80 900,80"/>
      <polygon points="0,0 -900,-260 -900,-100"/><polygon points="0,0 900,-260 900,-100"/>
    </g>
  </g>
  <rect y="330" width="1280" height="70" fill="#d4143c"/>
  <rect y="322" width="1280" height="8" fill="#ffd000"/>

  <!-- the TV -->
  <g transform="translate(70 60)">
    <rect x="-10" y="-10" width="420" height="300" rx="28" fill="#6b3b1a"/>
    <rect x="0" y="0" width="400" height="280" rx="22" fill="#a05a28"/>
    <rect x="22" y="22" width="286" height="236" rx="30" fill="#0b0b0b"/>
    <rect x="34" y="34" width="262" height="212" rx="24" fill="#071a07"/>
    <g font-family="Menlo, Consolas, monospace" font-size="13" fill="#39ff6a">
      <text x="48" y="64">$ damien plan build</text>
      <text x="48" y="86">plan 8f6ed799 (7054)</text>
      <text x="48" y="108">  keep     6825</text>
      <text x="48" y="130">  trash     114</text>
      <text x="48" y="152">  archive    49</text>
      <text x="48" y="174">  label      66</text>
      <text x="48" y="206" fill="#ffd000">nothing has changed</text>
      <text x="48" y="226" fill="#ffd000">in Gmail. review, then:</text>
    </g>
    <rect x="34" y="34" width="262" height="212" rx="24" fill="url(#scan)"/>
    <!-- knobs -->
    <circle cx="352" cy="80" r="22" fill="#2b2b2b" stroke="#111" stroke-width="3"/>
    <circle cx="352" cy="150" r="22" fill="#2b2b2b" stroke="#111" stroke-width="3"/>
    <rect x="336" y="200" width="32" height="50" rx="4" fill="#111"/>
    <g stroke="#ccc" stroke-width="1"><line x1="340" y1="208" x2="364" y2="208"/><line x1="340" y1="218" x2="364" y2="218"/><line x1="340" y1="228" x2="364" y2="228"/><line x1="340" y1="238" x2="364" y2="238"/></g>
    <!-- antenna -->
    <g stroke="#ddd" stroke-width="5" stroke-linecap="round"><line x1="200" y1="-10" x2="120" y2="-110"/><line x1="200" y1="-10" x2="280" y2="-110"/></g>
    <circle cx="200" cy="-8" r="12" fill="#2b2b2b"/>
  </g>

  <!-- wordmark -->
  <g filter="url(#shadow)">
    <text x="560" y="150" font-size="120" fill="url(#gold)" stroke="#5a2a00" stroke-width="4" letter-spacing="4">DAMIEN</text>
  </g>
  <text x="562" y="200" font-size="34" fill="#fff" stroke="#003" stroke-width="1">THE INBOX CLEANER THAT</text>
  <text x="562" y="262" font-size="64" fill="#ffd000" stroke="#7a0010" stroke-width="3">ASKS FIRST!</text>

  <g transform="translate(1120 150) rotate(-12) scale(0.92)">
    <polygon fill="#ffd000" stroke="#d4143c" stroke-width="5" points="0,-120 24,-74 72,-96 66,-44 118,-37 84,0 118,37 66,44 72,96 24,74 0,120 -24,74 -72,96 -66,44 -118,37 -84,0 -118,-37 -66,-44 -72,-96 -24,-74"/>
    <text text-anchor="middle" font-size="26" fill="#d4143c" y="-22">NEVER</text>
    <text text-anchor="middle" font-size="26" fill="#d4143c" y="8">DELETES!</text>
    <text text-anchor="middle" font-size="18" fill="#7a0010" y="36">NEVER SENDS!</text>
  </g>
  <!-- ticker -->
  <text x="640" y="376" text-anchor="middle" font-size="26" fill="#fff" textLength="1240" lengthAdjust="spacingAndGlyphs">107,710 → UNDER 7,000 MESSAGES  ★  $0.045 PER 1,000  ★  EVERY WRITE UNDOABLE</text>
</svg>
