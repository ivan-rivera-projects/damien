<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" font-family="Impact, 'Arial Black', Helvetica, sans-serif">
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" opacity="0.15"/></pattern>
  </defs>
  <!-- BEFORE: grayscale misery -->
  <rect width="640" height="420" fill="#9a9a9a"/>
  <rect width="640" height="420" fill="url(#scan)"/>
  <text x="320" y="60" text-anchor="middle" font-size="48" fill="#2a2a2a">BEFORE</text>
  <g transform="translate(70 90)">
    <rect width="500" height="280" rx="10" fill="#dcdcdc" stroke="#555" stroke-width="4"/>
    <rect width="500" height="44" rx="10" fill="#666"/>
    <text x="20" y="30" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#fff" font-weight="bold">Inbox (107,710)</text>
    <g font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#444">
      <text x="20" y="75">● FINAL HOURS!!! 90% OFF ENDS TONIGHT (2019)</text>
      <text x="20" y="103">● Your weekly digest of digests</text>
      <text x="20" y="131">● Re: Re: Re: Fwd: FW: quick question</text>
      <text x="20" y="159">● We miss you! Come back! Please!!</text>
      <text x="20" y="187">● 🎉 You've been selected (you have not)</text>
      <text x="20" y="215">● Your opinion matters: a 45-minute survey</text>
      <text x="20" y="243">● ...and 107,703 more</text>
    </g>
    <text x="250" y="200" text-anchor="middle" font-size="110" fill="#b00" opacity="0.25" transform="rotate(-18 250 200)">HELP</text>
  </g>
  <text x="320" y="405" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-style="italic" fill="#333">"Where's the email from my accountant?!"</text>

  <!-- AFTER: glorious color -->
  <rect x="640" width="640" height="420" fill="#1b4fd8"/>
  <g transform="translate(960 440)" opacity="0.3" fill="#fff">
    <polygon points="0,0 -700,-120 -700,120"/><polygon points="0,0 -400,-500 -200,-500"/>
    <polygon points="0,0 200,-500 400,-500"/><polygon points="0,0 700,-120 700,120"/>
  </g>
  <text x="960" y="60" text-anchor="middle" font-size="48" fill="#ffd000" stroke="#7a0010" stroke-width="2">AFTER!</text>
  <g transform="translate(710 90)">
    <rect width="500" height="280" rx="10" fill="#fff" stroke="#d4143c" stroke-width="4"/>
    <rect width="500" height="44" rx="10" fill="#d4143c"/>
    <text x="20" y="30" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#fff" font-weight="bold">Inbox (6,825)</text>
    <g font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#222">
      <text x="20" y="75">★ Your accountant: Q1 numbers attached</text>
      <text x="20" y="103">★ MOMDEM, LLC – 2026 Annual Report</text>
      <text x="20" y="131">★ Chase: your statement is available</text>
      <text x="20" y="159">★ Alex: dinner friday?</text>
      <text x="20" y="187">★ School: early dismissal Thursday</text>
      <text x="20" y="215" fill="#888">(114 promos → Trash · 49 → Archive · 66 → Labels)</text>
      <text x="20" y="243" fill="#1b4fd8" font-weight="bold">undo: damien run undo 2ba1162fdb34</text>
    </g>
  </g>
  <text x="960" y="405" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-style="italic" fill="#fff">"Three minutes. Seventeen cents. Nothing deleted."</text>

  <!-- the arrow -->
  <g transform="translate(640 210)">
    <circle r="54" fill="#ffd000" stroke="#d4143c" stroke-width="5"/>
    <text text-anchor="middle" y="18" font-size="52" fill="#d4143c">➜</text>
  </g>
</svg>
